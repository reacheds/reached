name: ✨ Feature Request
description: Suggest an idea or feature for Reached.
title: "[FEAT]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Reached better!
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which part of the ecosystem does this feature apply to?
      options:
        - Discord Bot (apps/bot)
        - Web Dashboard (apps/web)
        - Database (packages/database)
        - Shared Types (packages/types)
        - Entire Ecosystem
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
