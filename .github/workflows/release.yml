name: Release

on:
  push:
    branches: ["main"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Sürüm ve Changelog Yönetimi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Projects
        run: pnpm turbo run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          DISCORD_TOKEN: "mock_token_for_ci"
          DISCORD_CLIENT_ID: "123456789012345678"
          AUTH_SECRET: "mock_secret_for_ci_building_purposes_only_32_chars"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DISCORD_CLIENT_SECRET: "mock_secret_for_ci"

      # Changesets or release action step
      # - name: Create Release Pull Request or Publish to npm/GitHub
      #   uses: changesets/action@v1
      #   with:
      #     publish: pnpm changeset publish
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
